@font-face {

*{

body{

}  
  
.scoreboard{

.title{

.top{

.panel{

.blue{

.red{

}  
  
.blue h2{

}  
  
.red h2{

}  
  
.score-section{

}  
  
.label{

.blue .score{

.red .score{

}  
  
.controls{  
    display:grid;

}
.controls button{
  display:flex;
  justify-content:center;
  gap:10px;

button{

}  
  
.add{

    color:white;  
}  
  
.minus{

    color:white;  
}  
  
.reset{

    color:black;  
}
  
.fullscreen-btn{

    color:black;
}  
  
.check{

.penalties{

</div>  <script>  
  
let timerInterval;  
let roundDurationSeconds = 60;
let remainingMs = roundDurationSeconds * 1000;  
let isRunning = false;  
  
/* ADJUST VALUES */  
  
function adjust(id, amount){  
  
    let input = document.getElementById(id);  
  
    let value = parseInt(input.value) || 0;  
  
    value += amount;  
  
    if(value < 0) value = 0;  
  
    if(id === "round"){  
  
        if(value > 3) value = 3;  
    }  
  
    input.value = value;  
      
     /* AUTO ADV CHECK */

    if(id === "blueScore" || id === "redScore"){

        autoAdvantage();
    }
}  
  
/* AUTO ADVANTAGE CHECK */

function autoAdvantage(){

    let blueScore =
        parseInt(document.getElementById("blueScore").value) || 0;

    let redScore =
        parseInt(document.getElementById("redScore").value) || 0;

    let blueAdv =
        document.getElementById("blueAdv");

    let redAdv =
        document.getElementById("redAdv");

    /* RESET IF BOTH ARE ZERO */

    if(blueScore === 0 && redScore === 0){

        blueAdv.checked = false;
        redAdv.checked = false;

        return;
    }

    /* FIRST POINT GETS ADV ONLY ONCE */

    if(
        blueScore > 0 &&
        redScore === 0 &&
        !blueAdv.checked &&
        !redAdv.checked
    ){

        blueAdv.checked = true;
    }

    else if(
        redScore > 0 &&
        blueScore === 0 &&
        !blueAdv.checked &&
        !redAdv.checked
    ){

        redAdv.checked = true;
    }
}
  
/* MATCH CONTEXT + RESULT BRIDGE */
const scoreQuery=new URLSearchParams(location.search);
const scoreCourt=scoreQuery.get('court')||'1';
let currentMatch=null;
let resultSent=false;
let resultSaving=false;
let completedResultEdit=false;
function activeTid(){return scoreQuery.get('tournament')||''}
async function loadTournamentBranding(){
  const tid=activeTid(); if(!tid||!window.RADIUM_DB)return;
  try{
    await window.RADIUM_DB.init();
    const tr=await window.RADIUM_DB.select('tournaments',{select:'name,settings',eq:{id:tid},limit:1});
    const row=tr.data?.[0]||{};
    const title=row.name||'RADIUM TOURNAMENT';
    const te=document.getElementById('tournamentTitle'); if(te)te.textContent=title;
    const logos=Array.isArray(row.settings?.setup?.scoreboardLogos)?row.settings.setup.scoreboardLogos:[];
    try{const lr=await window.RADIUM_DB.select('scoreboard_logos',{select:'slot,storage_path',eq:{tournament_id:tid},limit:20});(lr.data||[]).forEach(x=>{const u=window.RADIUM_DB.state?.client?.storage.from('radium-scoreboard-logos').getPublicUrl(x.storage_path);if(u?.data?.publicUrl)logos[Number(x.slot)-1]=u.data.publicUrl})}catch(_){}
    for(let i=0;i<4;i++){const el=document.getElementById('logo'+(i+1));if(el){const src=logos[i]||'';el.src=src;el.style.display=src?'block':'none';}}
  }catch(e){console.warn('Tournament branding load:',e)}
}

let cloudMatchId=scoreQuery.get('matchId')||'';
async function loadCurrentMatch(){
  const urlMatch=(scoreQuery.get('categoryId')&&scoreQuery.get('round')!==null&&scoreQuery.get('match')!==null)?{
    categoryId:scoreQuery.get('categoryId'),categoryName:scoreQuery.get('categoryName')||'',event:scoreQuery.get('event')||'',
    round:Number(scoreQuery.get('round'))||1,match:Number(scoreQuery.get('match'))||1,red:scoreQuery.get('red'),blue:scoreQuery.get('blue'),
    redName:scoreQuery.get('redName')||scoreQuery.get('red')||'RED',blueName:scoreQuery.get('blueName')||scoreQuery.get('blue')||'BLUE',court:Number(scoreQuery.get('court')||1),matchFormat:scoreQuery.get('matchFormat')||'single',tournament:activeTid(),matchId:cloudMatchId
  }:null;

function awardWinner(winner){

  const prior=Array.isArray(window.__RADIUM_ROUND_SCORES)?window.__RADIUM_ROUND_SCORES.slice():[];
  prior[round-1]={round,blueScore:roundState.blueScore,redScore:roundState.redScore,winnerSide:winner,blueFouls:roundState.blueFouls,redFouls:roundState.redFouls,blueDisarms:roundState.blueDisarms,redDisarms:roundState.redDisarms};
  window.__RADIUM_ROUND_SCORES=prior;

  // A single-round match ends as soon as the official awards the round.
  // This is the default for Combatives and prevents the scoreboard from
  // forcing the competitors into Round 2 or Round 3.
  if(format==='1'){
    sendMatchResult(winner);
    setAdvanceButton(true);

  // Optional Best-of-3 mode: only continue when the match has not yet been decided.
  const blueWins=[1,2,3].filter(i=>document.getElementById('winner'+i)?.innerText==='BLUE').length;

  }

function formatCountdown(ms){
    ms=Math.max(0,Math.round(ms));
    const mins=Math.floor(ms/60000), secs=Math.floor((ms%60000)/1000), milli=ms%1000;
    return String(mins).padStart(2,'0')+":"+String(secs).padStart(2,'0')+"."+String(milli).padStart(3,'0');
}

function manualTimeEdit(){

    if(secs>59)return;
    remainingMs=Math.max(0,mins*60000+secs*1000+milli);

/* AUTOMATIC ROUND DECISION — fires when the clock hits 00:00.
   No manual AWARD click needed. Priority: foul disqualification,
   then higher score, then recorded advantage (ADV) as a tiebreaker. */
function autoDecideRoundWinner(){
    if(resultSent)return;
    const blueScore=parseInt(document.getElementById("blueScore").value)||0;
    const redScore=parseInt(document.getElementById("redScore").value)||0;
    const blueAdv=document.getElementById("blueAdv").checked,redAdv=document.getElementById("redAdv").checked;
    let blueFouls=0,redFouls=0;
    if(document.getElementById("bf1").checked)blueFouls++;if(document.getElementById("bf2").checked)blueFouls++;if(document.getElementById("bf3").checked)blueFouls++;
    if(document.getElementById("rf1").checked)redFouls++;if(document.getElementById("rf2").checked)redFouls++;if(document.getElementById("rf3").checked)redFouls++;
    let blueDisarms=0,redDisarms=0;
    if(document.getElementById("bd1").checked)blueDisarms++;if(document.getElementById("bd2").checked)blueDisarms++;
    if(document.getElementById("rd1").checked)redDisarms++;if(document.getElementById("rd2").checked)redDisarms++;

    let winner=null,reason='';
    // Disqualification checks take priority over everything else.
    if(blueFouls>=3){winner='RED';reason='BLUE disqualified — 3 fouls';}
    else if(redFouls>=3){winner='BLUE';reason='RED disqualified — 3 fouls';}
    else if(blueDisarms>=2){winner='RED';reason='BLUE disqualified — 2 disarms';}
    else if(redDisarms>=2){winner='BLUE';reason='RED disqualified — 2 disarms';}
    // Clear score decides it.
    else if(blueScore>redScore){winner='BLUE';reason='Higher score';}
    else if(redScore>blueScore){winner='RED';reason='Higher score';}
    // Score tied: advantage decides, UNLESS the ADV holder has a foul —
    // in that case the opponent is awarded the round instead.
    else if(blueAdv&&!redAdv){
        if(blueFouls>=1){winner='RED';reason='Score tied — BLUE held advantage but has a foul; RED awarded';}
        else{winner='BLUE';reason='Score tied — decided by recorded advantage';}
    }
    else if(redAdv&&!blueAdv){
        if(redFouls>=1){winner='BLUE';reason='Score tied — RED held advantage but has a foul; BLUE awarded';}
        else{winner='RED';reason='Score tied — decided by recorded advantage';}
    }

    if(winner){
        awardWinner(winner);
        const info=document.getElementById('matchInfo');
        if(info)info.dataset.lastDecision=reason;
    }else{
        alert('Time is up and the round is tied with no recorded advantage. Award the round winner manually using AWARD BLUE / AWARD RED.');
    }
}

}
function resetTimer(){  
  
    if(resultSent&&!completedResultEdit){alert('This match is already finalized. Use EDIT RESULT if a correction is required.');return;}
    if(resultSaving)return;
    if(completedResultEdit)return alert('Use the restored round data above to correct the result. RESET is disabled during EDIT RESULT.');
    resultSent=false;
    document.querySelectorAll('.winner-buttons button').forEach(b=>b.disabled=false);
    clearInterval(timerInterval);  
  
    isRunning = false;  
  
    remainingMs = roundDurationSeconds * 1000;  
  
    updateTimer();  
  
    document.getElementById("blueScore").value = 0;  
    document.getElementById("redScore").value = 0;  
  
    document.getElementById("round").value = 1;
    window.__RADIUM_ROUND_SCORES=[];
    setAdvanceButton(false);  
  
    for(let i = 1; i <= 3; i++){  
  
        let winner =  
            document.getElementById("winner" + i);  
  
        let card =  
            winner.closest(".round-card");  
  
        winner.innerText = "---";  
  
        winner.className = "winner-display";  
  
        document.getElementById("score" + i).innerText =  
            "0 - 0";  
  
        document.getElementById("stats" + i).innerText =  
            "F:0-0 | D:0-0";  
  
        /* RESET CARD COLORS */  
  
        card.style.background = "";  
        card.style.color = "white";  
    }  
  
    document.getElementById("blueChampion").innerText = "";  
    document.getElementById("redChampion").innerText = "";  
  
    document.getElementById("blueAdv").checked = false;  
    document.getElementById("redAdv").checked = false;  
  
    document.getElementById("bf1").checked = false;  
    document.getElementById("bf2").checked = false;  
    document.getElementById("bf3").checked = false;  
  
    document.getElementById("rf1").checked = false;  
    document.getElementById("rf2").checked = false;  
    document.getElementById("rf3").checked = false;  
  
    document.getElementById("bd1").checked = false;  
    document.getElementById("bd2").checked = false;  
  
    document.getElementById("rd1").checked = false;  
    document.getElementById("rd2").checked = false;  
}  
  
/* KEYBOARD SHORTCUTS */  
  
document.addEventListener("keydown", function(event){  
  
    let key = event.key.toLowerCase();  
  
    if(event.code === "Space"){  
  
        event.preventDefault();  
  
        if(isRunning){  
  
            pauseTimer();  
        }  
  
        else{  
  
            startTimer();  
        }  
    }
    if(key === "f"){

        toggleFullscreen();
    }
  
  
    if(key === "r"){  
  
        resetTimer();  
    }  
  
    if(key === "o"){  
  
        adjust("blueScore",1);  
    }  
  
    if(key === "l"){  
  
        adjust("blueScore",-1);  
    }  
  
    if(key === "q"){  
  
        adjust("redScore",1);  
    }  
  
    if(key === "a"){  
  
        adjust("redScore",-1);  
    }  
}); 
/* PLAY BUZZER */

function playBuzzer(){

    let buzzer =
        document.getElementById("buzzerSound");

    buzzer.currentTime = 5;

    buzzer.play();
}  
loadTournamentBranding().finally(()=>loadCurrentMatch()).then(()=>{document.getElementById('matchFormat')?.dispatchEvent(new Event('change'));syncMatchFormatLock();});
updateTimer();
  
</script>
